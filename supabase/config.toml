# Use Deno 2 for Edge Functions (avoids "Deno.core.runMicrotasks() is not supported"
# when Stripe SDK or other npm compat code runs in the runtime).
[edge_runtime]
deno_version = 2

[functions.get-publishable-key]
verify_jwt = false

[functions.docusign-envelopes]
verify_jwt = true

[functions.docusign-recipient-view]
verify_jwt = true

[functions.docusign-check-status]
verify_jwt = true

# DocuSign Connect cannot send a Supabase JWT; auth is HMAC via DOCUSIGN_WEBHOOK_SECRET.
[functions.docusign-webhook]
verify_jwt = false

# Called by pg_cron with x-cron-secret; polls DocuSign for stale open envelopes.
[functions.sync-pending-docusign]
verify_jwt = false

