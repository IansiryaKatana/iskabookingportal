# Netlify Configuration
# This file configures Netlify build and deployment settings

[build]
  command = "npm run build"
  publish = "dist"

# SPA routing - redirect all routes to index.html (except static assets)
# This allows React Router to handle client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Build environment
[build.environment]
  NODE_VERSION = "18"

# Headers for security and performance
# If you see CSP errors for fonts/Stripe/hCaptcha, ensure no stricter CSP is set in Netlify dashboard (e.g. Security headers).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Allow Google Fonts, Stripe, hCaptcha; avoids "font-src blocked" and "style-src blocked" console errors
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://*.hcaptcha.com https://newassets.hcaptcha.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://js.stripe.com https://hcaptcha.com https://*.hcaptcha.com https://m.stripe.network; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.stripe.com https://*.hcaptcha.com https://hcaptcha.com https://api.ipify.org; frame-src 'self' https://js.stripe.com https://*.hcaptcha.com https://newassets.hcaptcha.com https://m.stripe.network; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

